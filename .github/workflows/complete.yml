# Builds the SB COMPLETE Windows setup from the products' published Windows installers (releases <product>-<version>).
name: complete
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the product releases to bundle
        required: true
        default: "1.0.1"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the product installers
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          foreach ($p in 'armoury','nuclear','napalm','shrapnel','fallout','sentinel') {
            gh release download "$p-$env:V" -R $env:GITHUB_REPOSITORY -p '*Windows*Setup.exe' -D stage
            if ($LASTEXITCODE -ne 0) { throw "No Windows installer in release $p-$env:V" }
          }
          Get-ChildItem stage
      - name: Build SB COMPLETE setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DStage=$PWD\stage" "/DAppVersion=${{ inputs.version }}" "/O$PWD\dist" installer\SB-COMPLETE.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Test install (silent) and check every plug-in landed
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          $vst3 = Get-ChildItem "$env:CommonProgramFiles\VST3" -Recurse -Filter *.vst3 -Directory | Select-Object -ExpandProperty Name
          $vst3 | Sort-Object
          foreach ($n in 'NUCLEAR','SHRAPNEL','FALLOUT','SENTINEL') { if (-not ($vst3 -match $n)) { throw "$n.vst3 missing" } }
          if (-not ($vst3 -match 'napalm')) { throw "NAPALM vst3 missing" }
          if ($vst3.Count -lt 16) { throw "Only $($vst3.Count) VST3 plug-ins installed (expected 16: 11 Armoury effects + 5)" }
      - uses: actions/upload-artifact@v4
        with:
          name: SB-COMPLETE-Windows-x64-Setup
          path: dist/*.exe
